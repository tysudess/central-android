name: Validar Android (testes e compilação)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: validate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e compilação Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório Android
        uses: actions/checkout@v4

      - name: Baixar repositório desktop para sincronização
        uses: actions/checkout@v4
        with:
          repository: tysudess/noticias-python
          path: desktop
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar catálogo/configuração do desktop
        run: python scripts/sync_desktop.py desktop

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar configuração Gradle
        run: gradle tasks --no-daemon

      - name: Executar testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # Esta rotina não publica APK: APKs instaláveis são publicados apenas
      # pelo build-android.yml, com a chave persistente de assinatura.
      - name: Validar compilação de depuração
        run: gradle :app:assembleDebug --no-daemon --stacktrace
