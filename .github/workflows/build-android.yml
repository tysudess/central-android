name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: central-android-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android
        uses: actions/checkout@v4

      - name: Checkout projeto desktop para sincronizar catálogos/configuração
        uses: actions/checkout@v4
        with:
          repository: tysudess/noticias-python
          path: desktop
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar fontes, login e Capas com o desktop
        run: python scripts/sync_desktop.py desktop

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar e normalizar Secrets de assinatura
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD ANDROID_SIGNING_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret obrigatório ausente: $name. Cadastre-o em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          # Protege contra quebras de linha introduzidas ao copiar e colar no GitHub.
          KEYSTORE_B64="$(printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]')"
          STORE_PASSWORD="$(printf '%s' "$ANDROID_SIGNING_STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$ANDROID_SIGNING_KEY_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_SIGNING_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          KEYSTORE_PATH="$RUNNER_TEMP/central-android-upload-key.p12"
          DECODE_LOG="$RUNNER_TEMP/keystore-base64-check.log"
          KEYTOOL_LOG="$RUNNER_TEMP/keystore-key-check.log"

          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH" 2>"$DECODE_LOG"; then
            echo "::error::O Secret ANDROID_SIGNING_KEYSTORE_BASE64 não é um Base64 válido. Copie novamente todo o conteúdo do arquivo ANDROID_SIGNING_KEYSTORE_BASE64.txt."
            exit 1
          fi

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::O keystore decodificado está vazio. Confira o Secret ANDROID_SIGNING_KEYSTORE_BASE64."
            exit 1
          fi

          if ! keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$KEYTOOL_LOG"; then
            echo "::error::O arquivo Base64 foi decodificado, mas a chave não passou na validação. Confira ANDROID_SIGNING_STORE_PASSWORD e ANDROID_SIGNING_KEY_ALIAS com os arquivos privados. Nenhum valor secreto foi exibido."
            exit 1
          fi

          echo "Keystore PKCS12 e alias validados."

          # Usa valores sem CR/LF no resto do job, sem exibi-los nos logs.
          {
            echo "ANDROID_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER"
            echo "ANDROID_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Validar configuração Gradle
        run: gradle tasks --no-daemon

      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK ARM64 assinado para atualização
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar artefato e checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/Central-Inteligente-de-Midia-Android-arm64.apk
          sha256sum release/Central-Inteligente-de-Midia-Android-arm64.apk > release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
          test -s release/Central-Inteligente-de-Midia-Android-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Central-Android-APK-assinado
          path: |
            release/Central-Inteligente-de-Midia-Android-arm64.apk
            release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.sha }}
          name: Central Inteligente de Mídia Android - Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/Central-Inteligente-de-Midia-Android-arm64.apk
            release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
