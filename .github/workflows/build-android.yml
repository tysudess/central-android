name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: central-android-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android
        uses: actions/checkout@v4

      - name: Checkout projeto desktop para sincronizar catálogos/configuração
        uses: actions/checkout@v4
        with:
          repository: tysudess/noticias-python
          path: desktop

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar fontes, login e Capas com o desktop
        run: python scripts/sync_desktop.py desktop

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar configuração Gradle
        run: gradle tasks --no-daemon

      - name: Build APK ARM64
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar artefato
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Central-Inteligente-de-Midia-Android-arm64.apk
          sha256sum release/Central-Inteligente-de-Midia-Android-arm64.apk > release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
          test -s release/Central-Inteligente-de-Midia-Android-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Central-Android-APK
          path: |
            release/Central-Inteligente-de-Midia-Android-arm64.apk
            release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
          if-no-files-found: error

      - name: Criar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.sha }}
          name: Central Inteligente de Mídia Android - Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/Central-Inteligente-de-Midia-Android-arm64.apk
            release/Central-Inteligente-de-Midia-Android-arm64.apk.sha256
